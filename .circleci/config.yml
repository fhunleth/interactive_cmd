version: 2.1

latest: &latest
  pattern: "^1.19.*-erlang-28.*$"

tags: &tags
  [
    1.19.3-erlang-28.1.1-alpine-3.22.2,
    1.18.3-erlang-27.3.4-alpine-3.22.2,
    1.17.3-erlang-27.3.4-alpine-3.21.5,
    1.16.3-erlang-26.2.5.11-alpine-3.21.3
  ]

ubuntu_tags: &ubuntu_tags
  [
    1.19.3-erlang-28.1.1-ubuntu-noble-20251013,
    1.18.3-erlang-27.3.4-ubuntu-noble-20251013
  ]

jobs:
  check-license:
    docker:
      - image: fsfe/reuse:latest
    steps:
      - checkout
      - run: reuse lint

  build-test:
    parameters:
      tag:
        type: string
    docker:
      - image: hexpm/elixir:<< parameters.tag >>
    working_directory: ~/repo
    environment:
      LC_ALL: C.UTF-8
    steps:
      - run:
          name: Install system dependencies
          command: apk add --no-cache build-base util-linux
      - checkout
      - run:
          name: Install hex and rebar
          command: |
            mix local.hex --force
      - restore_cache:
          keys:
            - v1-mix-cache-<< parameters.tag >>-{{ checksum "mix.lock" }}
      - run: mix deps.get
      - run: MIX_ENV=test mix compile
      - run: script -e /dev/null -c 'echo "START";mix test --trace --max-failures 1 --timeout 10000;echo "AFTER MIX exit=$?";echo "DONE!"'
      - when:
          condition:
            matches: { <<: *latest, value: << parameters.tag >> }
          steps:
            - run: mix format --check-formatted
            - run: mix deps.unlock --check-unused
            - run: mix docs
            - run: mix hex.build
            - run: mix credo -a --strict
            - run: mix dialyzer
            - run: mix compile --warnings-as-errors
            - run: MIX_ENV=test mix compile --warnings-as-errors
      - save_cache:
          key: v1-mix-cache-<< parameters.tag >>-{{ checksum "mix.lock" }}
          paths:
            - _build
            - deps

  build-test-ubuntu:
    parameters:
      tag:
        type: string
    docker:
      - image: hexpm/elixir:<< parameters.tag >>
    working_directory: ~/repo
    environment:
      LC_ALL: C.UTF-8
    steps:
      - run:
          name: Install system dependencies
          command: apt-get update && apt-get install -y build-essential ca-certificates
      - checkout
      - run:
          name: Install hex and rebar
          command: |
            mix local.hex --force
      - restore_cache:
          keys:
            - v1-mix-cache-<< parameters.tag >>-{{ checksum "mix.lock" }}
      - run: mix deps.get
      - run: MIX_ENV=test mix compile
      - run: script -e -q /dev/null -c "echo START;mix test --timeout 10000;echo DONE!"
      - save_cache:
          key: v1-mix-cache-<< parameters.tag >>-{{ checksum "mix.lock" }}
          paths:
            - _build
            - deps

  build-test-macos:
    macos:
      xcode: 15.4.0
    working_directory: ~/repo
    environment:
      LC_ALL: C.UTF-8
    steps:
      - checkout
      - run:
          name: Install Erlang and Elixir
          command: |
            brew install erlang elixir
      - run:
          name: Install hex
          command: |
            mix local.hex --force
      - run: mix deps.get
      - run: mix test

workflows:
  checks:
    jobs:
      - check-license:
          filters:
            tags:
              only: /.*/
      - build-test:
          name: << matrix.tag >>
          matrix:
            parameters:
              tag: *tags
          filters:
            tags:
              only: /.*/
      - build-test-ubuntu:
          name: << matrix.tag >>
          matrix:
            parameters:
              tag: *ubuntu_tags
          filters:
            tags:
              only: /.*/
      - build-test-macos:
          filters:
            tags:
              only: /.*/"
